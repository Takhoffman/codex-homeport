name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Test model-routing bridge
        run: npm run test:shim
      - name: Test installer runtime probes
        run: npm run test:install
      - name: Build CLI
        run: swift build --product codex-multihome
      - name: Check help output
        run: .build/debug/codex-multihome --help
      - name: Check npm package
        run: npm pack --dry-run

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build checks
        run: npm run build
      - name: Test Windows runtime
        run: npm test
      - name: Check help output
        run: node .\codex-multihome.js --help
      - name: Check Windows package
        run: npm pack --dry-run
