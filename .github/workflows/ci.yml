name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Build CLI
        run: swift build --product homeport
      - name: Check help output
        run: .build/debug/homeport --help
