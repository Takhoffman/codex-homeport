name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.6.2
      - name: Verify version files match tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SWIFT_VERSION="$(grep 'static let version' Sources/HomeportCore/AppVersion.swift | sed -E 's/.*= "([^"]+)".*/\1/')"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$SWIFT_VERSION"
          test -f "releases/${GITHUB_REF_NAME}.md"
      - name: Test
        run: swift test
      - name: Test model-routing bridge
        run: npm run test:shim
      - name: Test installer runtime probes
        run: npm run test:install
      - name: Check package
        run: npm pack --dry-run
      - name: Check npm version
        id: npm-version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "codex-multihome@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file "releases/${GITHUB_REF_NAME}.md"
